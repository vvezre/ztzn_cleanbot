# JWT 配置
jwt:
  secret: ${JWT_SECRET:Y2xlYW5ib3Qtc2VjcmV0LWtleS1taW4tMjU2LWJpdHMtbG9uZy1mb3Itc2VjdXJpdHk=}
  expiration: 3600000      # Access token: 1小时 (单位: 毫秒)
  refresh-expiration: 604800000  # Refresh token: 7天
  header: Authorization
  token-prefix: Bearer

# DeepSeek AI 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-f68523db5ea640e39ed846c698af63b1}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  # 对话上下文保留轮数（每轮 = 1条user + 1条assistant）
  max-history-rounds: 10

# 日志配置
logging:
  level:
    com.zt.cleanbot: debug
    com.baomidou.mybatisplus: debug

server:
  port: 9798

spring:
  application:
    name: cleanbot
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pvcleaning?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    # 使用环境变量配置密码，避免将敏感信息提交到代码仓库
    # 方式1: 启动时添加 -DMYSQL_PASSWORD=your_password
    # 方式2: 在系统环境变量中设置 MYSQL_PASSWORD
    password: ${MYSQL_PASSWORD:root}
  redis:
    host: localhost
    port: 6379
    password:  # 如果没有密码就不填
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印SQL日志
  global-config:
    db-config:
      id-type: auto  # 主键自增
      logic-delete-field: deleted  # 逻辑删除字段
      logic-delete-value: 1  # 删除值
      logic-not-delete-value: 0  # 未删除值


